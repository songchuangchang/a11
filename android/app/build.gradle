plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.aichat"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.aichat"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        // 显式从 Flutter 插件注入的属性读取（修 "系统识别不出版本号"）
        // 对应 pubspec.yaml 的 `version: 1.2.1+4` => versionName=1.2.1  versionCode=4
        versionCode = flutter.versionCode as int
        versionName = flutter.versionName as String
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("debug")
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
}
