import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.aichat"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.aichat"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        // 显式从 Flutter 插件注入的属性读取（修 "系统识别不出版本号"）
        // 对应 pubspec.yaml 的 `version: 1.2.1+4` => versionName=1.2.1  versionCode=4
        versionCode = flutter.versionCode as int
        versionName = flutter.versionName as String
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.getByName("debug")
            minifyEnabled = keystorePropertiesFile.exists()
            shrinkResources = keystorePropertiesFile.exists()
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // v1.7.24（十大维度·构建与发布）：多渠道打包
    // 用法：flutter build apk --release --flavor store  /  --flavor direct
    flavorDimensions += "channel"
    productFlavors {
        store {
            dimension = "channel"
            manifestPlaceholders = [appChannel: "store"]
        }
        direct {
            dimension = "channel"
            manifestPlaceholders = [appChannel: "direct"]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.20"
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // v1.7.24（十大维度·性能）：LeakCanary 内存泄漏监控（仅 debug 生效，2.x 自动初始化）
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
}
